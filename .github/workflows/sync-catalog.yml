name: Sync catalogue anime/manga

on:
  schedule:
    # Chaque lundi à 4h UTC — pas besoin de plus fréquent, le squelette
    # (dataset + Wikidata) ne change pas vite, et la fraîcheur fine
    # (calendrier de diffusion) se limite de toute façon aux saisons en cours.
    - cron: "0 4 * * 1"
  workflow_dispatch: # permet aussi un lancement manuel depuis l'onglet Actions
    inputs:
      target:
        description: "Quoi synchroniser"
        type: choice
        default: both
        options: [both, anime, manga, ann]

jobs:
  # Ce workflow ne fait que les SOURCES (squelette dataset, Wikidata, ANN) :
  # quelques minutes au total. L'enrichissement MyAnimeList, lui, vit dans
  # enrich-catalog.yml — reprenable, quotidien, borné sous le plafond de 6 h.
  #
  # Ne JAMAIS remettre l'enrichissement MAL ici : non reprenable dans ces
  # scripts, il dépassait les 6 h, se faisait tuer chaque lundi sans rien
  # finir, et consommait ~360 minutes de quota GitHub Actions pour rien.
  sync-anime:
    if: github.event.inputs.target == '' || github.event.inputs.target == 'both' || github.event.inputs.target == 'anime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Sync anime (squelette dataset)
        run: node scripts/sync-anime.mjs --skeleton
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  sync-manga:
    if: github.event.inputs.target == '' || github.event.inputs.target == 'both' || github.event.inputs.target == 'manga'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      # Pas de MAL_CLIENT_ID transmis : c'est ce qui fait sauter la phase
      # d'enrichissement MyAnimeList du script, reprise par enrich-catalog.yml.
      - name: Sync manga (Wikidata)
        run: node scripts/sync-manga-wikidata.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Enrichissement Anime News Network : titres multilingues, équipe, casting
  # (dont les voix françaises), liens officiels, thèmes musicaux.
  # Passe APRÈS les deux autres : côté anime il lui faut les `ann_id` posés par
  # sync-anime, côté manga il déduplique contre les titres venus de Wikidata.
  # Rapide (~50 titres par requête, 1 req/s) : une quinzaine de minutes au total,
  # sans commune mesure avec les heures que prend l'enrichissement MyAnimeList.
  sync-ann:
    needs: [sync-anime, sync-manga]
    # `always()` : ANN reste utile même si l'un des deux jobs amont a échoué,
    # tant que la base contient déjà des lignes à enrichir.
    if: |
      always() &&
      (github.event.inputs.target == '' || github.event.inputs.target == 'both' || github.event.inputs.target == 'ann')
    runs-on: ubuntu-latest
    # Depuis que ce script cree aussi les fiches anime absentes, il parcourt
    # les 12 800 anime ET les 24 000 manga de l'encyclopedie ANN, a une requete
    # par seconde imposee par leurs conditions. Le passage du 2026-09-21 a ete
    # coupe net a 45 minutes, avant la fin du manga.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Sync Anime News Network
        run: node scripts/sync-ann.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
